<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка БУХЛОЧАТ</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --danger: #ef4444;
            --success: #10b981;
            --border: #2d2d34;
            --soft: #0f0f11;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
        }

        .topbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn, button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .btn {
            padding: 12px 18px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover, button:hover {
            background: var(--accent-hover);
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn.secondary:hover {
            background: rgba(255,255,255,0.05);
        }

        .auth-box {
            max-width: 420px;
            margin: 80px auto 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .auth-box h2 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .auth-box p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        input, textarea, select {
            width: 100%;
            background: var(--soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            margin-bottom: 12px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .error-msg {
            display: none;
            margin-top: 8px;
            color: var(--danger);
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .panel h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .event-item {
            background: var(--soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .event-item h4 {
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .event-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .tag {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #ffd65c;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.75rem;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .event-actions button {
            padding: 8px 12px;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border-radius: 8px;
        }

        .event-actions .danger {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .empty {
            color: var(--text-muted);
            padding: 20px 0;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .admin-actions button {
            padding: 11px 14px;
            background: var(--accent);
            color: #000;
            font-weight: 800;
            border-radius: 10px;
        }

        .admin-actions .secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar hidden" id="topbar">
            <a href="index.html" class="logo">БУХЛОЧАТ</a>
            <div class="topbar-actions">
                <a href="index.html" class="btn secondary">На главную</a>
                <button class="btn secondary" onclick="logoutAdmin()">Выйти</button>
            </div>
        </div>

        <div id="auth-block">
            <div class="auth-box">
                <h2>Админка</h2>
                <p>Введите секретное имя директора</p>
                <input type="text" id="admin-password" placeholder="Введите имя...">
                <button class="btn" style="width:100%;" onclick="checkAdminLogin()">Войти</button>
                <div id="admin-error" class="error-msg">Неверно. Директор расстроится.</div>
            </div>
        </div>

        <div id="dashboard" class="dashboard hidden">
            <section class="panel">
                <h3>Добавить событие</h3>
                <input type="text" id="event-title" placeholder="Название события">
                <input type="date" id="event-date">
                <input type="time" id="event-time">
                <input type="text" id="event-location" placeholder="Место">
                <textarea id="event-description" placeholder="Описание события"></textarea>
                <input type="number" id="event-limit" value="30" min="1" placeholder="Лимит участников">

                <div class="admin-actions">
                    <button type="button" onclick="saveEvent()">Сохранить событие</button>
                    <button type="button" class="secondary" onclick="resetForm()">Очистить</button>
                </div>

                <div class="admin-actions" style="margin-top: 20px;">
                    <button type="button" class="secondary" onclick="downloadEventsJson()">Скачать events.json</button>
                    <input id="import-events-input" type="file" accept="application/json" class="hidden" onchange="importEventsJson(this)">
                    <button type="button" class="secondary" onclick="document.getElementById('import-events-input').click()">Импорт JSON</button>
                </div>
            </section>

            <section class="panel">
                <h3>Список событий</h3>
                <div id="events-list" class="event-list"></div>
            </section>
        </div>
    </div>

    <script>
        const EVENTS_KEY = 'buhlo_events_data';
        const ADMIN_KEY = 'buhlo_admin';
        let appEvents = [];
        let editingEventId = null;

        function checkAdminLogin() {
            const value = document.getElementById('admin-password').value.trim().toLowerCase();
            if (value === 'лена') {
                localStorage.setItem(ADMIN_KEY, 'true');
                showDashboard();
                loadEvents();
            } else {
                document.getElementById('admin-error').style.display = 'block';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem(ADMIN_KEY);
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-error').style.display = 'none';
            document.getElementById('auth-block').classList.remove('hidden');
            document.getElementById('topbar').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('topbar').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function getDefaultEvents() {
            return [
                {
                    id: 1,
                    title: 'Пятничный сбор',
                    date: '2026-10-03',
                    time: '19:00',
                    location: 'Наше стандартное место / беседки',
                    description: 'Еженедельный сбор компании для хорошего настроения',
                    participants: [],
                    maxParticipants: 50
                },
                {
                    id: 2,
                    title: 'Глобальный выезд на Нёман',
                    date: '2026-07-17',
                    time: '09:00',
                    location: 'р. Неман',
                    description: 'Ежегодный эпический выезд: лодки, палатки, казаны, хорошее настроение',
                    participants: [],
                    maxParticipants: 30
                }
            ];
        }

        function getSavedEvents() {
            const raw = localStorage.getItem(EVENTS_KEY);
            if (!raw) {
                localStorage.setItem(EVENTS_KEY, JSON.stringify(getDefaultEvents()));
                return getDefaultEvents();
            }

            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : (parsed.events || getDefaultEvents());
            } catch (error) {
                return getDefaultEvents();
            }
        }

        async function loadEvents() {
            appEvents = getSavedEvents();

            try {
                const response = await fetch('events.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data && Array.isArray(data.events)) {
                        appEvents = data.events;
                        localStorage.setItem(EVENTS_KEY, JSON.stringify(appEvents));
                    }
                }
            } catch (error) {
                console.log('Файл events.json не найден, используется localStorage');
            }

            renderEvents();
        }

        function renderEvents() {
            const list = document.getElementById('events-list');
            if (!appEvents.length) {
                list.innerHTML = '<div class="empty">События пока не добавлены.</div>';
                return;
            }

            list.innerHTML = appEvents.map(event => {
                const participants = Array.isArray(event.participants) ? event.participants : [];
                const dateText = event.date ? formatDate(event.date) : 'Дата не указана';
                return `
                    <div class="event-item">
                        <h4>${event.title}</h4>
                        <p>${event.description || 'Описание отсутствует'}</p>
                        <div class="event-meta">
                            <span class="tag">${dateText}</span>
                            <span class="tag">${event.time || 'Время не указано'}</span>
                            <span class="tag">${event.location || 'Место не указано'}</span>
                            <span class="tag">${participants.length}/${event.maxParticipants || 30}</span>
                        </div>
                        <div class="event-actions">
                            <button type="button" onclick="editEvent(${event.id})">Редактировать</button>
                            <button type="button" class="danger" onclick="deleteEvent(${event.id})">Удалить</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString + 'T12:00:00');
            if (Number.isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function saveEvent() {
            const title = document.getElementById('event-title').value.trim();
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const location = document.getElementById('event-location').value.trim();
            const description = document.getElementById('event-description').value.trim();
            const limit = Number(document.getElementById('event-limit').value) || 30;

            if (!title || !date) {
                alert('Заполните название и дату события');
                return;
            }

            if (editingEventId !== null) {
                const idx = appEvents.findIndex(item => item.id === editingEventId);
                if (idx >= 0) {
                    appEvents[idx] = {
                        ...appEvents[idx],
                        title,
                        date,
                        time,
                        location: location || appEvents[idx].location || 'Место не указано',
                        description: description || appEvents[idx].description || 'Описание события скоро появится.',
                        maxParticipants: limit
                    };
                }
            } else {
                appEvents.unshift({
                    id: Date.now(),
                    title,
                    date,
                    time,
                    location: location || 'Место не указано',
                    description: description || 'Описание события скоро появится.',
                    participants: [],
                    maxParticipants: limit
                });
            }

            localStorage.setItem(EVENTS_KEY, JSON.stringify(appEvents));
            renderEvents();
            resetForm();
        }

        function editEvent(eventId) {
            const event = appEvents.find(item => item.id === eventId);
            if (!event) return;

            editingEventId = eventId;
            document.getElementById('event-title').value = event.title || '';
            document.getElementById('event-date').value = event.date || '';
            document.getElementById('event-time').value = event.time || '';
            document.getElementById('event-location').value = event.location || '';
            document.getElementById('event-description').value = event.description || '';
            document.getElementById('event-limit').value = event.maxParticipants || 30;

            const button = document.querySelector('.admin-actions button');
            if (button) {
                button.textContent = 'Обновить событие';
            }
        }

        function deleteEvent(eventId) {
            if (!confirm('Удалить событие?')) return;
            appEvents = appEvents.filter(item => item.id !== eventId);
            localStorage.setItem(EVENTS_KEY, JSON.stringify(appEvents));
            renderEvents();
            if (editingEventId === eventId) {
                resetForm();
            }
        }

        function resetForm() {
            editingEventId = null;
            document.getElementById('event-title').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-time').value = '';
            document.getElementById('event-location').value = '';
            document.getElementById('event-description').value = '';
            document.getElementById('event-limit').value = 30;

            const button = document.querySelector('.admin-actions button');
            if (button) {
                button.textContent = 'Сохранить событие';
            }
        }

        function downloadEventsJson() {
            const data = JSON.stringify({ events: appEvents }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'events.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importEventsJson(input) {
            const file = input.files && input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    const items = Array.isArray(parsed) ? parsed : parsed.events;
                    if (!Array.isArray(items)) {
                        throw new Error('Некорректный формат JSON');
                    }
                    appEvents = items;
                    localStorage.setItem(EVENTS_KEY, JSON.stringify(appEvents));
                    renderEvents();
                    alert('JSON успешно импортирован');
                } catch (error) {
                    alert('Ошибка импорта: ' + error.message);
                }
                input.value = '';
            };
            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const isAdmin = localStorage.getItem(ADMIN_KEY) === 'true';
            if (isAdmin) {
                showDashboard();
                loadEvents();
            }
        });
    </script>
</body>
</html>
